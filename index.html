<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero">
        <div class="content">
            <h1 class="title">Help Street Animals</h1>
            <h1 class="title1">Find a Better Life.</h1>
            <p class="discription">Found an animal that needs help? Report it and connect with people who care. Every
                report connects
                compassionate neighbors, volunteers, and local clinics.</p>
        </div>
        <div class="btns">
            <button class="btn1"><img src="Icon.svg" alt="">Report an Animal </button>
            <button class="btn2"><img src="Container.svg" alt="">Explore Animals </button>
        </div>

        <div class="stats">
            <div>
                <h1 class="stat-number">142</h1>
                <p class="desc">Animals Helped this month</p>
            </div>
            <div>
                <h1 class="response-time">18 min</h1>
                <p class="desc">Average community response</p>
            </div>
            <div>
                <h1 class="location">Tbilisi</h1>
                <p class="desc">Active neighborhood hub</p>
            </div>
        </div>

        <div class="image">
            <img src="stray.jpg" alt="">
        </div>

    </div>





</body>

</html>
